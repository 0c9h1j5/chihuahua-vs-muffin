[project]
name = "chihuahua-vs-muffin"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HYJUN", email = "0c9h1j5@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
chihuahua-vs-muffin = "chihuahua_vs_muffin:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
